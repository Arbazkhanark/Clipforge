name: Build Media Verification Worker

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'docker/worker-runtime/**'
      - 'prisma/**'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - '.github/workflows/build-media-verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish verification worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker-media-verification
          platforms: linux/amd64
          push: true
          tags: ghcr.io/arbazkhanark/clipforge-media-verification:${{ github.sha }}
